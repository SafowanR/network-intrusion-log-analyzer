<!DOCTYPE html>
<html>
<head>
    <title>WASM Test</title>
</head>
<body>
    <h1>Testing WebAssembly Module</h1>
    <div id="output">Loading...</div>

    <script src="app.js"></script>
    <script>
        Module.onRuntimeInitialized = function() {
            const output = document.getElementById("output");
            const analyzer = new Module.WebLogAnalyzer();

            analyzer.processConnection("192.168.1.10", "2026-08-12 10:00", 443, false);
            analyzer.processConnection("192.168.1.10", "2026-08-12 10:05", 22, true);
            analyzer.processConnection("10.0.0.5", "2026-08-12 11:00", 80, false);

            const riskReport = analyzer.getRiskReport();
            let riskReportHTML = "<h3>Risk Report</h3>";
            for (let i = 0; i < riskReport.size(); i++) {
                const record = riskReport.get(i);
                riskReportHTML += record.ip + " - risk: " + record.riskScore + "<br>";
            }

            const testResults = Module.runTestSuite();
            let testResultsHTML = "<h3>Test Suite</h3>";
            for (let i = 0; i < testResults.size(); i++) {
                const result = testResults.get(i);
                testResultsHTML += result.name + ": " + (result.passed ? "PASS" : "FAIL") + "<br>";
            }

            output.innerHTML = riskReportHTML + testResultsHTML;
        };
    </script>
</body>
</html>
